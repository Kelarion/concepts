[project]
name = "sbmf"
version = "0.1.0"
description = "Sparse and semi-binary matrix factorization: binary autoencoder models, samplers and utilities"
readme = "README.md"
authors = [{ name = "Matteo Alleman", email = "mmallemmann@gmail.com" }]
license = "MIT"
license-files = ["LICEN[CS]E*"]
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "numba>=0.59",
    "torch>=2.0",
    "scikit-learn>=1.3",      # bae_util.fpcv's default classifier
    "networkx>=3.0",
    "cvxpy>=1.4",             # df_util cut decompositions (CLARABEL solver)
    "tqdm>=4.60",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]    # df_util.plotgraph / plotwalk
graph = ["pydot>=2.0"]        # graphviz_layout in df_util.signdraw / plotgraph / plotwalk
polytope = ["pypoman"]        # df_util.enumerate_cuts
all = ["sbmf[plot,graph,polytope]"]

[project.urls]
Repository = "https://github.com/Kelarion/concepts"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sbmf"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Real errors only; the code predates any linter.
select = ["F821", "F811", "F823", "B006", "B023", "E9"]

[tool.ruff.lint.per-file-ignores]
# unfinished drafts that reference names which do not exist yet (bae_util.kercv,
# df_util.reassign and one other draft)
"src/sbmf/bae_util.py" = ["F821"]
"src/sbmf/df_util.py" = ["F821"]
"src/sbmf/bae_priors.py" = ["B023"]   # closure is called inside the loop iteration
